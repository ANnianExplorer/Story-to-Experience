name: xujing

# Local development database only. Test runs use a separate database on the
# same instance (xujing_test) and never touch development data.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: xujing
      POSTGRES_PASSWORD: xujing_dev
      POSTGRES_DB: xujing
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xujing -d xujing"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - xujing-pg:/var/lib/postgresql/data

volumes:
  xujing-pg:
