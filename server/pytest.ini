[pytest]
testpaths = ../server/tests ../apps/api/tests
pythonpath = .. ../apps/api
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -q --strict-markers
markers =
    db: requires a reachable PostgreSQL test database
    simulated: uses a scripted model provider; not real model evidence
filterwarnings =
    ignore::DeprecationWarning:langgraph.*
